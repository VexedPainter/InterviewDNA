<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Branded SVG favicon (DNA helix mark) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="InterviewDNA — Agentic RAG-powered mock interview platform grounded in 10 years of placement archives." />
    <meta name="theme-color" content="#07090e" />
    <title>InterviewDNA — Agentic Mock Interview Platform</title>

    <!-- Prevent flash of wrong theme (FOCT) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('interviewdna-theme');
          if (saved === 'light') {
            document.documentElement.classList.add('light');
          } else if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
